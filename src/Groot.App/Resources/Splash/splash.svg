<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456" version="1.1">
  <!-- The mark the boot screen starts on: the rings, face on, the view down the end of a loaded
       bar. The animated one in boot-loader.css takes over from here, so the splash and the first
       frame of the app are the same picture. Colours are the dark palette from GrootPalette.cs. -->
  <rect width="456" height="456" fill="#1d2419"/>
  <g transform="translate(228,228)" fill="none">
    <circle r="200" stroke="#33402c" stroke-width="20"/>
    <circle r="137" stroke="#e0aa4a" stroke-width="28"/>
    <circle r="78" stroke="#7fb47a" stroke-width="23"/>
    <circle r="16" fill="#c49a6c" opacity="0.85"/>
  </g>
</svg>
