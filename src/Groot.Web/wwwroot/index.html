<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groot</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="_content/Groot.UI/fonts/fraunces-latin.woff2" />
    <link rel="stylesheet" href="_content/Groot.UI/fonts.css" />
    <link rel="stylesheet" href="_content/Groot.UI/tokens.css" />
    <link rel="stylesheet" href="_content/Groot.UI/boot-loader.css" />
    <meta name="theme-color" content="#151a12" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Groot.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="g-boot">
            <svg class="g-boot-rings" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <line class="g-bar" x1="14%" y1="50%" x2="86%" y2="50%" />
                <circle class="g-ring g-ring-2 g-plate g-far" cx="50%" cy="50%" r="30%" />
                <circle class="g-ring g-ring-2 g-plate g-near" cx="50%" cy="50%" r="30%" />
                <circle class="g-ring g-ring-1 g-plate g-far" cx="50%" cy="50%" r="17%" />
                <circle class="g-ring g-ring-1 g-plate g-near" cx="50%" cy="50%" r="17%" />
                <circle class="g-ring-track" cx="50%" cy="50%" r="44%" />
                <circle class="g-ring-progress" cx="50%" cy="50%" r="44%" />
                <circle class="g-pith" cx="50%" cy="50%" r="3.5%" />
            </svg>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Registration throws on a page served over plain http (LAN testing) and in browsers
        // without service workers. The app runs fine without one; it just is not installable.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.warn('Groot: service worker not registered.', error));
        }
    </script>
</body>

</html>
