<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groot</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/Groot.UI/tokens.css" />
    <link rel="stylesheet" href="_content/Groot.UI/boot-loader.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Groot.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="g-boot">
            <svg class="g-boot-rings" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                <circle class="g-ring g-ring-1" cx="50%" cy="50%" r="17%" />
                <circle class="g-ring g-ring-2" cx="50%" cy="50%" r="30%" />
                <circle class="g-ring-track" cx="50%" cy="50%" r="44%" />
                <circle class="g-ring-progress" cx="50%" cy="50%" r="44%" />
                <circle class="g-pith" cx="50%" cy="50%" r="6%" />
            </svg>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
